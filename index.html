<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="color-scheme" content="dark">
  <title>Masuk | Lamp Login</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Font: ada fallback sistem, jadi tetap tampil rapi saat offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <noscript>
    <style>.login-zone{opacity:1;visibility:visible;transform:none}.hint{display:none}</style>
  </noscript>
</head>
<body>

  <!-- Sprite ikon (inline, tanpa library eksternal) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
      <symbol id="i-google" viewBox="0 0 24 24">
        <path fill="#4285F4" stroke="none" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
        <path fill="#34A853" stroke="none" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" stroke="none" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
        <path fill="#EA4335" stroke="none" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
      </symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></symbol>
    </defs>
  </svg>

  <!-- Latar ruangan + kunang-kunang -->
  <div class="room" aria-hidden="true"></div>
  <canvas id="fireflies" aria-hidden="true"></canvas>

  <main class="scene">

    <!-- Lampu gantung -->
    <section class="lamp-zone" aria-label="Lampu">
      <div class="lamp" id="lamp">
        <span class="lamp-wire"></span>
        <span class="lamp-cap"></span>

        <div class="lamp-head">
          <span class="lamp-glow"></span>
          <span class="lamp-beam"></span>
          <span class="lamp-shade"></span>
          <span class="lamp-bulb"></span>

          <button type="button" class="cord" id="lampCord" aria-pressed="false" aria-label="Nyalakan lampu">
            <span class="cord-line"></span>
            <span class="cord-handle"></span>
          </button>
        </div>
      </div>

      <p class="hint" id="hint">Tarik tali emas untuk menyalakan lampu</p>
    </section>

    <!-- Form login -->
    <section class="login-zone" aria-label="Form masuk">
      <div class="card">
        <header class="card-head">
          <h1 class="card-title">Selamat datang kembali</h1>
          <p class="card-sub">Masuk untuk melanjutkan ke akunmu.</p>
        </header>

        <form id="loginForm" novalidate>
          <div class="field" id="field-identity">
            <label for="identity">Email atau username</label>
            <div class="control">
              <svg class="ico" aria-hidden="true"><use href="#i-user"/></svg>
              <input type="text" id="identity" name="identity" placeholder="nama@email.com"
                     autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
                     inputmode="email" aria-describedby="identity-error">
            </div>
            <p class="error" id="identity-error" role="alert"></p>
          </div>

          <div class="field" id="field-password">
            <label for="password">Kata sandi</label>
            <div class="control">
              <svg class="ico" aria-hidden="true"><use href="#i-lock"/></svg>
              <input type="password" id="password" name="password" class="has-toggle" placeholder="Minimal 6 karakter"
                     autocomplete="current-password" aria-describedby="password-error">
              <button type="button" class="toggle" id="togglePassword" aria-label="Tampilkan kata sandi" aria-pressed="false">
                <svg class="ico" aria-hidden="true"><use href="#i-eye" id="toggleIcon"/></svg>
              </button>
            </div>
            <p class="error" id="password-error" role="alert"></p>
          </div>

          <div class="options">
            <label class="check">
              <input type="checkbox" id="remember" name="remember">
              <span>Ingat saya</span>
            </label>
            <button type="button" class="link" id="forgotBtn">Lupa kata sandi?</button>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Masuk</span>
          </button>
        </form>

        <div class="divider"><span>atau masuk dengan</span></div>

        <div class="socials">
          <button type="button" class="btn-social" data-provider="Google">
            <svg class="ico ico-fill" aria-hidden="true"><use href="#i-google"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="btn-social" data-provider="GitHub">
            <svg class="ico ico-fill" aria-hidden="true"><use href="#i-github"/></svg>
            <span>GitHub</span>
          </button>
        </div>

        <p class="card-foot">Belum punya akun? <button type="button" class="link" id="signupBtn">Daftar</button></p>
      </div>
    </section>
  </main>

  <!-- Notifikasi -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="ico" aria-hidden="true"><use href="#i-check" id="toastIcon"/></svg>
    <span id="toastMsg"></span>
  </div>

  <script src="js/fireflies.js"></script>
  <script src="js/lamp.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
